    // document mints the blobs for its OWN frames, obtaining page text

      // and sender identity (own child frame / direct parent) is checked

    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.

    const resourceBlobs = {};

    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;

      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];

        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {

      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

    // preserve ordering (React before ReactDOM before Babel before text/babel).

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);

      }

        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }

    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

0 0;font:700 clamp(30px,4vw,48px)/1.1 'Poppins',sans-serif;letter-spacing:-.04em;text-wrap:balance\">What faster reviews are worth to your team<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"margin:0;font:400 16px/1.6 'Poppins',sans-serif;color:#5B6B62;max-width:44ch\">Plug in your own volumes. The estimate updates as you type.<\u002Fp>\n      <\u002Fdiv>\n      <div ref=\"{{ roiRef }}\" style=\"margin-top:36px;border-radius:30px;background:#E4F3E9;padding:12px\">\n        <sc-if value=\"{{ roiLoaded }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"Business Impact Calculator\" hint-size=\"100%,620px\"><\u002Fdc-import><\u002Fsc-if>\n        <sc-if value=\"{{ roiLoading }}\" hint-placeholder-val=\"{{ true }}\"><div aria-hidden=\"true\" style=\"height:600px;border-radius:24px;background:linear-gradient(90deg,#FFFFFF 0px,#EEF2EF 350px,#FFFFFF 700px);background-size:1400px 100%;animation:biShim 1.4s linear infinite\"><\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <dc-import name=\"Pricing and Proof\" hint-size=\"100%,2600px\"><\u002Fdc-import>\n  <\u002Fmain>\n  <dc-import name=\"Demo Request and Footer\" hint-size=\"100%,1300px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { y: 0, prog: 0, active: null, w: typeof window !== 'undefined' ? window.innerWidth : 1280, menu: false, menuIn: false, seen: {}, ring: 0 };\n  _lazyRefs = {};\n  traceRef = React.createRef(); riskRef = React.createRef(); roiRef = React.createRef();\n  TILES = [\n    { key: 'income', kind: 'explorer', num: '01', label: 'Income Reality Check', tag: 'toggle raw vs verified', title: 'Separate real income from money passing through', desc: 'Idanimo matches salary credits to payroll and strips out P2P transfers, circular loops and unmatched payouts. Of the ₦6,073,000 Ngozi received, only 66% is income you can lend against.', flex: '12 1 100%', bg: '#07190F', border: '#07190F', labelC: '#C8F04D', titleC: '#FFFFFF', subC: '#AFD6BD', h: '560px' },\n    { key: 'score', anchor: 'score', kind: 'explorer', num: '02', label: 'Idanimo Score', tag: 'drag the what-if sliders', title: 'One score, five behaviours you can see', desc: 'The score runs from 212 to 850 and is built from income stability, expenses, repayment, debt capacity and engagement. Move a slider to see which behaviour would lift Ngozi’s score, and by how much.', flex: '12 1 100%', bg: '#E4F3E9', border: '#D6EBDD', labelC: '#1E6B3E', titleC: '#0F1A14', subC: '#3D4B43', h: '520px' },\n    { key: 'spend', kind: 'explorer', num: '03', label: 'Spending Behaviour', tag: 'click a month', title: 'Know where the money goes after payday', desc: 'Every debit is sorted into living costs, loan repayments, gambling and transfers. Months that break your gambling gate turn red, and one click shows who the money went to.', flex: '12 1 100%', bg: '#FFFFFF', border: '#E3EAE5', labelC: '#1E6B3E', titleC: '#0F1A14', subC: '#5B6B62', h: '540px' },\n    { key: 'cash', kind: 'explorer', num: '04', label: 'Cash Flow Timeline', tag: 'drag the strip to zoom', title: 'Spot shortfalls before they become defaults', desc: 'The daily closing balance with money in and out for the whole year. Red bands mark days below zero, so recurring end-of-month gaps stand out at a glance.', flex: '12 1 100%', bg: '#0C2E1B', border: '#0C2E1B', labelC: '#C8F04D', titleC: '#FFFFFF', subC: '#AFD6BD', h: '520px' },\n    { key: 'integrity', kind: 'explorer', num: '05', label: 'Statement Integrity', tag: 'hover the red marker', title: 'Catch edited statements automatically', desc: 'Idanimo recalculates the running balance from every transaction and compares it with the balance printed on the statement. Where the two lines split, the document has been changed.', flex: '12 1 100%', bg: '#E4F3E9', border: '#D6EBDD', labelC: '#1E6B3E', titleC: '#0F1A14', subC: '#3D4B43', h: '480px' },\n    { key: 'bureau', kind: 'explorer', num: '06', label: 'Score vs Bureau', tag: 'click a borrower', title: 'Find the risk a bureau score misses', desc: 'Forty borrowers plotted by bureau score and Idanimo Score. The red corner holds people the bureau rates well but whose bank statements tell a riskier story.', flex: '12 1 100%', bg: '#1E6B3E', border: '#1E6B3E', labelC: '#C8F04D', titleC: '#FFFFFF', subC: '#D6EBDD', h: '520px' },\n    { key: 'ring', kind: 'ring', flex: '4 1 280px', bg: '#2C8A52', border: '#2C8A52' },\n    { key: 'avatars', kind: 'avatars', flex: '4 1 280px', bg: '#1E6B3E', border: '#1E6B3E' },\n    { key: 'number', kind: 'number', flex: '4 1 280px', bg: '#FFFFFF', border: '#E3EAE5' }\n  ];\n  componentDidMount() {\n    this.onScroll = () => { cancelAnimationFrame(this._raf); this._raf = requestAnimationFrame(() => {\n      const y = window.scrollY, h = document.documentElement.scrollHeight - window.innerHeight;\n      const ids = ['platform', 'features', 'trace', 'score', 'pricing', 'faq']; let active = null, best = -1e9;\n      ids.forEach((id) => { const el = document.getElementById(id); if (!el) return; const t = el.getBoundingClientRect().top; if (t < 140 && t > best) { best = t; active = id; } });\n      const sc = document.getElementById('score'); if (sc && active === 'score') { const r = sc.getBoundingClientRect(); if (r.bottom < 140) active = 'features'; }\n      const ft = document.getElementById('features'); if (active === 'features' && ft && ft.getBoundingClientRect().bottom < 140) active = null;\n      this.setState({ y, prog: h > 0 ? Math.min(1, y / h) : 0, active }); }); };\n    this.onResize = () => this.setState({ w: window.innerWidth });\n    this.onKey = (e) => { if (e.key === 'Escape' && this.state.ex) this.closeEx(); }; window.addEventListener('keydown', this.onKey);\n    window.addEventListener('scroll', this.onScroll, { passive: true }); window.addEventListener('resize', this.onResize); this.onScroll();\n    this.io = 'IntersectionObserver' in window ? new IntersectionObserver((es) => { es.forEach((e) => { if (e.isIntersecting) { const k = e.target.getAttribute('data-lazy'); this.io.unobserve(e.target); this.setState((s) => ({ seen: { ...s.seen, [k]: true } })); } }); }, { rootMargin: '500px 0px' }) : null;\n    [['trace', this.traceRef], ['risk', this.riskRef], ['roi', this.roiRef]].forEach(([k, r]) => this.watch(k, r.current));\n    const go = () => BI.inView(document.getElementById('features'), () => { this._c = BI.tween(0, 1, 1400, (v) => this.setState({ ring: v })); });\n    if (window.BI) go(); else this._w = setInterval(() => { if (window.BI) { clearInterval(this._w); go(); } }, 40);\n  }\n  openEx(k) { this._lastFocus = document.activeElement; document.body.style.overflow = 'hidden'; this.setState({ ex: k }); }\n  closeEx() { document.body.style.overflow = ''; this.setState({ ex: null }); this._lastFocus && this._lastFocus.focus && this._lastFocus.focus(); }\n  componentWillUnmount() { document.body.style.overflow = ''; window.removeEventListener('keydown', this.onKey); window.removeEventListener('scroll', this.onScroll); window.removeEventListener('resize', this.onResize); this.io && this.io.disconnect(); clearInterval(this._w); this._c && this._c(); }\n  watch(k, el) { if (!el) return; el.setAttribute('data-lazy', k); if (this.io) this.io.observe(el); else this.setState((s) => ({ seen: { ...s.seen, [k]: true } })); }\n  refFor(k) { if (!this._lazyRefs[k]) this._lazyRefs[k] = (el) => this.watch(k, el); return this._lazyRefs[k]; }\n  renderVals() {\n    const s = this.state, scrolled = s.y > 40, desktop = s.w >= 1000;\n    const links = [['Platform', '#platform', 'platform'], ['Features', '#features', 'features'], ['Transaction Trace', '#trace', 'trace'], ['Score', '#score', 'score'], ['Pricing', '#pricing', 'pricing'], ['FAQ', '#faq', 'faq']].map(([label, href, id]) => {\n      const on = s.active === id; return { label, href, cur: on ? 'true' : undefined, fg: on ? (scrolled ? '#FFFFFF' : '#07190F') : (scrolled ? '#0F1A14' : '#FFFFFF'), bg: on ? (scrolled ? '#1E6B3E' : '#C8F04D') : 'transparent' }; });\n    const bento = this.TILES.map((t) => { const loaded = !!s.seen['b-' + t.key];\n      return { ...t, anchor: t.anchor || undefined, ref: t.kind === 'explorer' ? this.refFor('b-' + t.key) : undefined, isExplorer: t.kind === 'explorer', isRing: t.kind === 'ring', isAvatars: t.kind === 'avatars', isNumber: t.kind === 'number',\n        pad: t.kind === 'explorer' ? '10px' : '26px', loaded, loading: !loaded, ['is_' + t.key]: true, flex: desktop || t.flex.startsWith('12') ? t.flex : '1 1 100%' }; });\n    let cfBars = [], negDays = 0, payX = '30%', cfRange = '', payLabel = '25', negBefore = true;\n    if (window.BI) { const cf = BI.data.cashflow; negDays = cf.filter((d) => d.bal < 0).length;\n      let pi = cf.findIndex((d, i) => d.dd === 25 && i >= 30 && cf.slice(i - 5, i).filter((x) => x.bal < 0).length >= 3); if (pi < 0) pi = cf.findIndex((d, i) => d.dd === 25 && i >= 30);\n      const st = Math.max(0, Math.min(cf.length - 45, pi - 32)), win = cf.slice(st, st + 45); cfRange = win[0].label + ' – ' + win[win.length - 1].label + ' 2024'; payLabel = cf[pi].label;\n      negBefore = cf.slice(pi - 5, pi).some((x) => x.bal < 0); const mx = Math.max(...win.map((d) => Math.abs(d.bal))) || 1, Z = 66;\n      cfBars = win.map((d, i) => { const pay = st + i === pi, neg = d.bal < 0, h = Math.max(1.5, Math.abs(d.bal) / mx * (neg ? 30 : 62));\n        if (pay) payX = (100 - i / win.length * 100) + '%';\n        return { top: (neg ? Z : Z - h) + '%', h: h + '%', r: neg ? '0 0 5px 5px' : '5px 5px 0 0', bg: pay ? 'linear-gradient(#1E6B3E,#2C8A52)' : neg ? 'rgba(229,72,77,.55)' : 'rgba(30,107,62,.2)' }; }); }\n    const exKeys = { income: 'Income reality check', score: 'Idanimo Score breakdown', spend: 'Spending behaviour', integrity: 'Statement integrity', cash: 'Cash flow and balance timeline', gates: 'Risk gates', afford: 'Affordability simulator', trace: 'Transaction Trace' };\n    const exV = {}; Object.keys(exKeys).forEach((k) => { exV['ex_' + k] = s.ex === k; exV['open_' + k] = () => this.openEx(k); });\n    return {\n      ...exV, exOpen: !!s.ex, exBg: s.ex === 'trace' ? '#0C2E1B' : '#F5F8F6', exLabel: s.ex ? exKeys[s.ex] + ' explorer' : '', closeEx: () => this.closeEx(), stop: (e) => e.stopPropagation(),\n      cfBars, negDays, payX, cfRange, payLabel, payNote: negBefore ? 'Overdrawn the days before' : 'Salary lands, balance recovers',\n      dimBars: [['Income stability', 22], ['Repayment', 20], ['Engagement', 62]].map(([l, v]) => ({ l, v: v + '/100', w: (v * Math.max(s.ring, .001)) + '%' })),\n      desktop, mobile: !desktop, links, bento,\n      navPad: scrolled ? '10px 16px' : '18px 16px',\n      navBg: scrolled ? 'rgba(255,255,255,.78)' : 'rgba(7,25,15,.0)', navBorder: scrolled ? 'rgba(15,26,20,.08)' : 'rgba(255,255,255,.0)', navBlur: scrolled ? 'blur(16px) saturate(1.4)' : 'none',\n      navShadow: scrolled ? '0 10px 30px rgba(7,25,15,.08)' : 'none', navFg: scrolled ? '#0F1A14' : '#FFFFFF', markC: scrolled ? '#1E6B3E' : '#C8F04D', pillBg: scrolled ? 'rgba(15,26,20,.04)' : 'rgba(255,255,255,.08)',\n      progress: (s.prog * 100) + '%', progOp: scrolled ? 1 : 0,\n      menu: s.menu, menuT: s.menuIn ? 'translateX(0)' : 'translateX(100%)',\n      openMenu: () => { this.setState({ menu: true }); setTimeout(() => this.setState({ menuIn: true }), 20); },\n      closeMenu: () => { this.setState({ menuIn: false }); setTimeout(() => this.setState({ menu: false }), 300); },\n      fab: !desktop && s.y > 600 && !s.menu,\n      traceRef: this.traceRef, riskRef: this.riskRef, roiRef: this.roiRef,\n      traceLoaded: !!s.seen.trace, traceLoading: !s.seen.trace, riskLoaded: !!s.seen.risk, riskLoading: !s.seen.risk, roiLoaded: !!s.seen.roi, roiLoading: !s.seen.roi,\n      ringArc: window.BI ? BI.arc(100, 100, 80, 0, Math.max(0.5, 360 * 0.66 * s.ring)) : '',\n      avatars: [['NE', '#C8F04D', '#07190F'], ['SA', '#E5484D', '#FFFFFF'], ['CN', '#F5A623', '#07190F'], ['AO', '#FFFFFF', '#0C2E1B']].map(([i, bg, fg]) => ({ i, bg, fg })),\n      incomeBars: [['Payroll salary · verified', '₦334,000', 66, '#1E6B3E'], ['P2P and unclassified · excluded', '₦116,000', 23, '#7C3AED'], ['Business payouts · unmatched', '₦30,000', 6, '#F5A623'], ['Investment coupons · own funds', '₦25,000', 5, '#F97316']].map(([l, v, p, c]) => ({ l, v, c, w: (p * s.ring) + '%' })),\n      benefits: [\n        { t: 'Reveals true income', d: 'Payroll-matched salary, separated from transfers and loans.' },\n        { t: 'Detects inflated cash flow', d: 'A-to-B-to-A loops flagged with the naira they added.' },\n        { t: 'Finds hidden obligations', d: 'Undeclared loans and ajo groups pulled from narrations.' },\n        { t: 'Improves affordability', d: 'Debt service based on what really leaves the account.' }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
